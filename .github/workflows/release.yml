name: Release

# Builds Sheaf for Windows and Mac, runs every check on each system, and publishes a GitHub release with:
#   Sheaf-Setup.exe                 Windows installer
#   Sheaf-windows.zip               Windows, portable
#   Sheaf-mac.dmg                   Mac with Apple silicon (M-series), macOS 14 or later
#   SHA256SUMS.txt
#
# Three ways to run it:
#   - Actions → Release → Run workflow, "Publish" ticked, on main: publishes the next patch version
#     (1.1.0 → 1.1.1), for example after dependency updates. If src/sheaf/__init__.py already names a newer
#     version than the last release, that version is used instead.
#   - Pushing a tag such as v1.2.0 (must match src/sheaf/__init__.py): publishes that version.
#   - Run workflow without "Publish": builds the files as a downloadable artifact only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a new release (from main)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.v.outputs.value }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: v
        env:
          PUBLISH: ${{ inputs.publish }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          src=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/sheaf/__init__.py)
          if [ "$REF_TYPE" = tag ]; then
            [ "$REF_NAME" = "v$src" ] || { echo "Tag $REF_NAME does not match the app version $src"; exit 1; }
            v=$src; publish=true
          elif [ "$PUBLISH" = true ]; then
            [ "$REF_NAME" = main ] || { echo "Releases are published from main only"; exit 1; }
            last=$(git tag --list 'v*' --sort=-v:refname | head -1); last=${last#v}
            newest=$(printf '%s\n%s\n' "$src" "$last" | sort -V | tail -1)
            if [ "$newest" = "$src" ] && [ "$src" != "$last" ]; then
              v=$src
            else
              IFS=. read -r major minor patch <<< "$last"; v="$major.$minor.$((patch + 1))"
            fi
            publish=true
          else
            v=$src; publish=false
          fi
          echo "Version $v, publish: $publish"
          echo "value=$v" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Stamp version
        run: python tools/set_version.py ${{ needs.version.outputs.value }}
      - name: Install
        run: python -m pip install -c requirements.txt -e ".[dev]"
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python tools/check_no_network.py
          python -m bandit -q -r src
          python -m pip_audit --skip-editable
          python -m pytest -q
      - name: Build app
        run: python -m PyInstaller --noconfirm --windowed --name Sheaf --icon assets/sheaf.ico --paths src tools/launcher.py
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /Qp "/DAppVersion=${{ needs.version.outputs.value }}" installer\sheaf.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Portable zip
        shell: pwsh
        run: |
          Copy-Item LICENSE, README.md dist/Sheaf/
          Compress-Archive -Path dist/Sheaf -DestinationPath dist/Sheaf-windows.zip
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            dist/Sheaf-Setup.exe
            dist/Sheaf-windows.zip
          if-no-files-found: error

  mac:
    # Apple silicon only: PyMuPDF 2 no longer publishes Intel Mac builds.
    needs: version
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Stamp version
        run: python tools/set_version.py ${{ needs.version.outputs.value }}
      - name: Install
        run: python -m pip install -c requirements.txt -e ".[dev]"
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python tools/check_no_network.py
          python -m bandit -q -r src
          python -m pip_audit --skip-editable
          python -m pytest -q
      - name: Icon
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python tools/make_icon.py --iconset build/Sheaf.iconset
          iconutil -c icns build/Sheaf.iconset -o build/Sheaf.icns
      - name: Build app
        run: python -m PyInstaller --noconfirm installer/sheaf-mac.spec
      - name: Sign ad hoc and verify
        # No Apple Developer certificate: an ad hoc signature keeps the bundle intact and runnable.
        run: |
          codesign --force --deep --sign - dist/Sheaf.app
          codesign --verify --deep --strict --verbose=2 dist/Sheaf.app
      - name: Smoke test
        # Start the real app in the runner's desktop session with a PDF and check it stays up.
        run: |
          python -c "import pymupdf; d = pymupdf.open(); d.new_page().insert_text((72, 100), 'Sheaf smoke test'); d.save('build/sample.pdf')"
          dist/Sheaf.app/Contents/MacOS/Sheaf build/sample.pdf &
          pid=$!
          sleep 15
          screencapture -x build/screenshot-mac.png || true
          kill -0 $pid
          kill $pid
      - name: Disk image
        run: |
          mkdir -p build/dmg
          ditto dist/Sheaf.app build/dmg/Sheaf.app
          ln -s /Applications build/dmg/Applications
          hdiutil create -volname Sheaf -srcfolder build/dmg -ov -format UDZO dist/Sheaf-mac.dmg
      - uses: actions/upload-artifact@v7
        with:
          name: mac
          path: dist/Sheaf-mac.dmg
          if-no-files-found: error
      - name: Keep screenshot (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-mac
          path: build/screenshot-mac.png
          if-no-files-found: ignore

  release:
    needs: [version, windows, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: "{windows,mac}"
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum Sheaf-Setup.exe Sheaf-windows.zip Sheaf-mac.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Keep build (test runs)
        if: needs.version.outputs.publish != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: Sheaf-all
          path: dist/*
      - name: Publish release
        if: needs.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.version.outputs.value }}
        run: >-
          gh release create "v$V" dist/Sheaf-Setup.exe dist/Sheaf-windows.zip dist/Sheaf-mac.dmg dist/SHA256SUMS.txt
          --target "$GITHUB_SHA" --title "Sheaf v$V" --notes-file .github/release-notes.md
