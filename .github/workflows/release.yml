name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python tools/check_no_network.py
          python -m pytest -q
      - name: Build
        run: python -m PyInstaller --noconfirm --windowed --name Sheaf --paths src tools/launcher.py
      - name: Package
        shell: pwsh
        run: |
          Copy-Item LICENSE, README.md dist/Sheaf/
          Compress-Archive -Path dist/Sheaf -DestinationPath Sheaf-windows.zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" Sheaf-windows.zip --title "Sheaf ${{ github.ref_name }}" --generate-notes
