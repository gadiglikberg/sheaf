name: Release

# A tag like v1.0.0 builds Sheaf, runs every check, and publishes a GitHub release with
# Sheaf-Setup.exe (installer) and Sheaf-windows.zip (portable). Running it by hand
# ("Run workflow") builds the same files as a downloadable artifact without publishing anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python tools/check_no_network.py
          python -m bandit -q -r src
          python -m pytest -q
      - name: Version
        id: version
        shell: pwsh
        run: |
          $v = python -c "import sheaf; print(sheaf.__version__)"
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "v$v") {
            throw "Tag ${{ github.ref_name }} does not match the app version $v"
          }
          "value=$v" >> $env:GITHUB_OUTPUT
      - name: Build app
        run: python -m PyInstaller --noconfirm --windowed --name Sheaf --icon assets/sheaf.ico --paths src tools/launcher.py
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /Qp "/DAppVersion=${{ steps.version.outputs.value }}" installer\sheaf.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Portable zip
        shell: pwsh
        run: |
          Copy-Item LICENSE, README.md dist/Sheaf/
          Compress-Archive -Path dist/Sheaf -DestinationPath dist/Sheaf-windows.zip
      - name: Checksums
        shell: pwsh
        run: |
          Get-FileHash dist/Sheaf-Setup.exe, dist/Sheaf-windows.zip -Algorithm SHA256 |
            ForEach-Object { "{0}  {1}" -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf) } |
            Set-Content dist/SHA256SUMS.txt
      - name: Keep build (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Sheaf-${{ steps.version.outputs.value }}
          path: |
            dist/Sheaf-Setup.exe
            dist/Sheaf-windows.zip
            dist/SHA256SUMS.txt
      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}" dist/Sheaf-Setup.exe dist/Sheaf-windows.zip dist/SHA256SUMS.txt
          --title "Sheaf ${{ github.ref_name }}" --notes-file .github/release-notes.md
