name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: No network code
        run: python tools/check_no_network.py
      - name: Static security scan
        run: python -m bandit -q -r src
      - name: Dependency vulnerabilities
        run: python -m pip_audit --skip-editable
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

  test-mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Checks
        run: |
          python tools/check_no_network.py
          python -m bandit -q -r src
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
