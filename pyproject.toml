[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sheaf-pdf"
version = "1.1.0"
description = "A simple, private PDF editor. Files never leave your computer."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.10"
dependencies = [
    "PyMuPDF>=1.26",
    "PySide6>=6.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "bandit>=1.7", "pip-audit>=2.7", "pyinstaller>=6"]

[project.gui-scripts]
sheaf = "sheaf.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
